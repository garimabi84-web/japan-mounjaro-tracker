name: Find new clinics from public SNS/web and monitor price sources
on:
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Full official clinic, SNS, and regional discovery queries (slower)'
        type: boolean
        default: true # Manual runs use all search regions; scheduled runs still use rotating queries
  push:
    branches: [main]
    paths:
      - 'discover.py'
      - 'national_sources.py'
      - 'watch_sources.py'
      - 'enrich_official.py'
      - 'source_price_parser.py'
      - 'strict_price_parser.py'
      - 'price_engine_v2.py'
      - 'price_integrity.py'
      - 'price_audit.py'
      - 'bulk_verify.py'
      - 'collect_promotions.py'
      - 'scan_changes.py'
      - 'index.template.html'
      - 'build.py'
      - '.github/workflows/price-check.yml'
  schedule:
    # 12:00 KST/JST daily = 03:00 UTC (GitHub may start later under load)
    - cron: '0 3 * * *'
permissions:
  contents: write
concurrency:
  group: price-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate discovery and official-price parsers
        run: |
          python -m py_compile discover.py national_sources.py enrich_official.py source_price_parser.py strict_price_parser.py price_engine_v2.py price_integrity.py bulk_verify.py price_audit.py collect_promotions.py scan_changes.py build.py
          python price_integrity.py
          python discover.py --self-test
          python national_sources.py --self-test
          python strict_price_parser.py
          python enrich_official.py --self-test
          python bulk_verify.py --self-test
          python price_audit.py --self-test
          python collect_promotions.py --self-test
          python scan_changes.py --self-test
      - name: Snapshot before scan for diff tracking
        run: python scan_changes.py --before
      - name: Discover institutions from MHLW public registry and comparison-site official links
        env:
          # A source-code push backfills every prefecture once; ordinary daily
          # scans rotate 18 prefectures per comparison source.
          FULL_SCAN: ${{ github.event_name == 'push' || inputs.full_scan }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            python national_sources.py --full-scan
          else
            python national_sources.py
          fi
      - name: Discover official clinic sites, public SNS posts and price-directory name leads
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            python discover.py --full-scan
          else
            python discover.py
          fi
      - name: Parallel price verification on candidate clinic official websites
        env:
          FULL_SCAN: ${{ github.event_name == 'push' || inputs.full_scan }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            python bulk_verify.py --limit 130
          else
            python bulk_verify.py --limit 80
          fi
      - name: Verify clinic identity and prices against official source pages
        env:
          FULL_SCAN: ${{ github.event_name == 'push' || inputs.full_scan }}
        run: python enrich_official.py
      - name: Reaudit already verified official prices and revoke cross-medication matches
        run: python price_audit.py --limit 450
      - name: Collect dated promotional prices separately from official prices
        run: python collect_promotions.py
      - name: Monitor the expanded official-source list
        run: python watch_sources.py
      - name: Save material changes from this scan
        run: python scan_changes.py --after
      - name: Rebuild offline HTML and comparison CSV
        run: python build.py
      - name: Validate built JavaScript syntax and embedded change history
        shell: bash
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          s=BeautifulSoup(open('index.html',encoding='utf-8').read(),'html.parser')
          scripts=[x.get_text() for x in s.select('script') if x.get('type')!='application/json' and not x.get('src')]
          assert any('const CURRENT_IDS' in x for x in scripts), 'missing per-scan changed clinic IDs'
          css='\n'.join(tag.get_text() for tag in s.select('style'))
          assert '.tbl tbody tr.record.changed' in css, 'missing yellow modified-row style'
          assert 'background:#fff0ae' in css, 'missing yellow highlight'
          assert 'function changeDescription' in '\n'.join(scripts), 'missing before-after change text'
          assert 'rowChangeNote(x.id)' in '\n'.join(scripts), 'missing inline change labels'
          assert 'detailsChangeNote(x.id)' in '\n'.join(scripts), 'missing detailed change panel'
          assert not s.select('#scan-changes'), 'obsolete separate changes list returned'
          assert '__CHANGES_JSON__' not in str(s), 'unbuilt change data marker'
          open('/tmp/mounjaro_tracker_check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/mounjaro_tracker_check.js
      - name: Commit three-channel discoveries, evidence and changed-page flags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Read the newest main BEFORE saving. A long SNS crawl can overlap
          # with a user editing a clinic or adding another workflow file.
          # Never replay stale catalog.json over newer manually verified data.
          refresh_from_main() {
            git fetch origin main
            git reset --hard origin/main
            python scan_changes.py --before
            python national_sources.py
            python discover.py
            python bulk_verify.py --limit 45
            python enrich_official.py
            python price_audit.py --limit 450
            python collect_promotions.py
            python watch_sources.py
            python scan_changes.py --after
            python build.py
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during discovery; rebuilding on latest committed data"
            refresh_from_main
          fi

          for attempt in 1 2 3; do
            git add catalog.json catalog.csv discoveries.json watch_state.json monitor.js index.html scan_changes.json national_registry.json.gz national_source_state.json national_discovery.json price_audit.json
            if git diff --staged --quiet; then
              echo "No updated data to commit"
              exit 0
            fi
            git commit -m 'Update clinic prices, ad evidence and per-scan change history'
            if git push origin HEAD:main; then
              echo "Updated tracker data saved"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "GitHub changed too frequently; leaving newer remote data untouched"
              exit 1
            fi
            echo "Push was rejected due to concurrent update; rerunning on current main"
            refresh_from_main
          done
