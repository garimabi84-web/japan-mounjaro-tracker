name: Find new clinics from public SNS/web and monitor price sources
on:
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'All Korean/SNS/regional discovery queries (slower)'
        type: boolean
        default: true # Manual runs use all search regions; scheduled runs still use rotating queries
  push:
    branches: [main]
    paths:
      - 'discover.py'
      - 'enrich_official.py'
      - 'catalog.json'
      - 'index.template.html'
      - 'build.py'
      - '.github/workflows/price-check.yml'
  schedule:
    # 12:00 KST/JST daily = 03:00 UTC (GitHub may start later under load)
    - cron: '0 3 * * *'
permissions:
  contents: write
concurrency:
  group: price-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate discovery and official-price parsers
        run: |
          python -m py_compile discover.py enrich_official.py build.py
          python discover.py --self-test
          python enrich_official.py --self-test
      - name: Discover from Korean traveler SNS ads and public web
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            python discover.py --full-scan
          else
            python discover.py
          fi
      - name: Verify official prices for new SNS-discovered clinics
        run: python enrich_official.py
      - name: Monitor the expanded official-source list
        run: python watch_sources.py
      - name: Rebuild offline HTML and comparison CSV
        run: python build.py
      - name: Commit new clinics, source evidence and changed-page flags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Read the newest main BEFORE saving. A long SNS crawl can overlap
          # with a user editing a clinic or adding another workflow file.
          # Never replay stale catalog.json over newer manually verified data.
          refresh_from_main() {
            git fetch origin main
            git reset --hard origin/main
            python discover.py
            python enrich_official.py
            python watch_sources.py
            python build.py
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during discovery; rebuilding on latest committed data"
            refresh_from_main
          fi

          for attempt in 1 2 3; do
            git add catalog.json catalog.csv discoveries.json watch_state.json monitor.js index.html
            if git diff --staged --quiet; then
              echo "No updated data to commit"
              exit 0
            fi
            git commit -m 'Daily public SNS clinic discovery and price-source monitoring'
            if git push origin HEAD:main; then
              echo "Updated tracker data saved"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "GitHub changed too frequently; leaving newer remote data untouched"
              exit 1
            fi
            echo "Push was rejected due to concurrent update; rerunning on current main"
            refresh_from_main
          done
