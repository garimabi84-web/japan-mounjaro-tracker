name: Find new clinics from public SNS/web and monitor price sources
on:
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Full official clinic, SNS, and regional discovery queries (slower)'
        type: boolean
        default: true # Manual runs use all search regions; scheduled runs still use rotating queries
  push:
    branches: [main]
    paths:
      - 'discover.py'
      - 'enrich_official.py'
      - 'collect_promotions.py'
      - 'scan_changes.py'
      - 'index.template.html'
      - 'build.py'
      - '.github/workflows/price-check.yml'
  schedule:
    # 12:00 KST/JST daily = 03:00 UTC (GitHub may start later under load)
    - cron: '0 3 * * *'
permissions:
  contents: write
concurrency:
  group: price-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate discovery and official-price parsers
        run: |
          python -m py_compile discover.py enrich_official.py collect_promotions.py scan_changes.py build.py
          python discover.py --self-test
          python enrich_official.py --self-test
          python collect_promotions.py --self-test
          python scan_changes.py --self-test
      - name: Inspect national open CSV and comparator clinic-list HTML
        run: |
          python - <<'PY'
          import requests,zipfile,io,csv,re
          from bs4 import BeautifulSoup
          from collections import Counter
          ses=requests.Session()
          ses.headers['User-Agent']='MounjaroPriceResearch/2.1 (public research; GitHub project)'
          URL='https://www.mhlw.go.jp/content/11121000/02-1_clinic_facility_info_20260601.csv.zip'
          try:
              r=ses.get(URL,timeout=(12,55));print('MHLW',r.status_code,len(r.content),r.headers.get('Content-Type'))
              if r.ok:
                  z=zipfile.ZipFile(io.BytesIO(r.content));print('ZIP_FILES',[(x.filename,x.file_size) for x in z.infolist()][:8])
                  for name in z.namelist()[:2]:
                      with z.open(name) as f:
                          txt=io.TextIOWrapper(f,encoding='utf-8-sig',errors='replace',newline='')
                          rd=csv.DictReader(txt)
                          print('CSV_HEADERS',rd.fieldnames[:180])
                          for a in range(2):
                              x=next(rd,None)
                              if x:print('CSV_EXAMPLE', {k:str(v)[:90] for k,v in x.items() if re.search('名称|都道府県|住所|所在地|ホームページ|URL|ＵＲＬ',k)})
          except Exception as e:print('MHLW_FAIL',repr(e)[:400])
          for u in ('https://sayaka-biyou-clinic.com/mounjaro/',
                    'https://sayaka-biyou-clinic.com/mounjaro/fukuoka/',
                    'https://sayaka-biyou-clinic.com/mounjaro/clinic/c4022400015580/',
                    'https://md.mirai-medical.clinic/',
                    'https://md.mirai-medical.clinic/prefectures40/'):
              try:
                  r=ses.get(u,timeout=(8,18));sp=BeautifulSoup(r.text,'html.parser')
                  from urllib.parse import urljoin,urlsplit
                  links=[(a.get_text(' ',strip=True)[:65],urljoin(u,a.get('href',''))) for a in sp.select('a[href]')]
                  print('DIRECTORY',u,r.status_code,len(r.content),'total_links',len(links),'title',(sp.title.get_text(' ',strip=True)[:80] if sp.title else '-'))
                  print('CLINIC_LINKS',[(t,h) for t,h in links if re.search(r'/clinic/|/prefectures',h)][:12])
                  print('OFFICIAL_LINKS',[(t,h) for t,h in links if '公式' in t or '料金の記載' in t][:14])
                  print('SECTION_HEADS',[x.get_text(' ',strip=True)[:75] for x in sp.select('h2,h3,h4')][:20])
              except Exception as e:print('DIRECTORY_FAIL',u,repr(e)[:240])
          PY
      - name: Snapshot before scan for diff tracking
        run: python scan_changes.py --before
      - name: Discover official clinic sites, public SNS posts and price-directory name leads
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            python discover.py --full-scan
          else
            python discover.py
          fi
      - name: Verify clinic identity and prices against official source pages
        run: python enrich_official.py
      - name: Collect dated promotional prices separately from official prices
        run: python collect_promotions.py
      - name: Monitor the expanded official-source list
        run: python watch_sources.py
      - name: Save material changes from this scan
        run: python scan_changes.py --after
      - name: Rebuild offline HTML and comparison CSV
        run: python build.py
      - name: Validate built JavaScript syntax and embedded change history
        shell: bash
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          s=BeautifulSoup(open('index.html',encoding='utf-8').read(),'html.parser')
          scripts=[x.get_text() for x in s.select('script') if x.get('type')!='application/json' and not x.get('src')]
          assert any('renderScanChanges' in x for x in scripts), 'missing scan change viewer'
          assert '__CHANGES_JSON__' not in str(s), 'unbuilt change data marker'
          open('/tmp/mounjaro_tracker_check.js','w',encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/mounjaro_tracker_check.js
      - name: Commit three-channel discoveries, evidence and changed-page flags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Read the newest main BEFORE saving. A long SNS crawl can overlap
          # with a user editing a clinic or adding another workflow file.
          # Never replay stale catalog.json over newer manually verified data.
          refresh_from_main() {
            git fetch origin main
            git reset --hard origin/main
            python scan_changes.py --before
            python discover.py
            python enrich_official.py
            python collect_promotions.py
            python watch_sources.py
            python scan_changes.py --after
            python build.py
          }

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during discovery; rebuilding on latest committed data"
            refresh_from_main
          fi

          for attempt in 1 2 3; do
            git add catalog.json catalog.csv discoveries.json watch_state.json monitor.js index.html scan_changes.json
            if git diff --staged --quiet; then
              echo "No updated data to commit"
              exit 0
            fi
            git commit -m 'Update clinic prices, ad evidence and per-scan change history'
            if git push origin HEAD:main; then
              echo "Updated tracker data saved"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "GitHub changed too frequently; leaving newer remote data untouched"
              exit 1
            fi
            echo "Push was rejected due to concurrent update; rerunning on current main"
            refresh_from_main
          done
