name: Repair Sakai 4-pen / 12-pen prices
on:
  push:
    branches: [main]
    paths:
      - 'repair_sakai_price.py'
      - '.github/workflows/repair-sakai-price.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Correct 4-pen / 12-pen price conversion
        run: |
          git fetch origin main
          git reset --hard origin/main
          python repair_sakai_price.py
          python build.py
      - name: Publish corrected clinic data and website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add catalog.json catalog.csv scan_changes.json index.html
            if git diff --staged --quiet; then
              echo "No price change"
              exit 0
            fi
            git commit -m 'Correct Sakai clinic 4-pen prices to accurate 12-pen equivalents'
            if git push origin HEAD:main; then
              echo "Corrected website data saved and Pages publishing initiated"
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Concurrent commits prevented price correction"
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            python repair_sakai_price.py
            python build.py
          done
