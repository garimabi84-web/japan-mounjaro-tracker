name: Publish Mounjaro Tracker website

# workflow_run is required: the price-check workflow commits with GITHUB_TOKEN,
# and those commits do not trigger ordinary push workflows.
on:
  workflow_run:
    workflows:
      - "Find new clinics from public SNS/web and monitor price sources"
      - "Full all-dose official price integrity audit V2"
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pages.yml"
      - "index.html"
      - "index.template.html"
      - "scan_changes.py"
      - "scan_changes.json"
      - "price_integrity.py"
      - "catalog.json"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest tracker files
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild latest site from verified catalog and current template
        run: |
          python price_integrity.py
          python scan_changes.py --self-test
          python build.py
      - name: Verify tracker HTML and JavaScript
        run: |
          python -m py_compile build.py
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '외국인 처방 미확인' in s
          assert '예약 방법·링크' in s
          assert 'select-type.com/rsv/?id=kMqp7M4u8eM' in s
          inline = s.rsplit('<script>', 1)[-1].split('</script>', 1)[0]
          assert 'function bookingLink(x)' in inline
          assert 'function changeDescription(item)' in inline
          assert 'rowChangeNote(x.id)' in inline
          assert 'detailsChangeNote(x.id)' in inline
          Path('/tmp/mounjaro-frontend.js').write_text(inline, encoding='utf-8')
          print('HTML content checks passed')
          PY
          node --check /tmp/mounjaro-frontend.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp catalog.csv _site/catalog.csv
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          # A rerun would otherwise create a second 'github-pages' artifact
          # with the same name and make deploy-pages fail deterministically.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait until the uploaded artifact is visible to Pages API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 18); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -Fxq "$TARGET_NAME"; then
              echo "Pages artifact registered: $TARGET_NAME"
              # Allow the Pages artifact metadata service to catch up too.
              sleep 8
              exit 0
            fi
            echo "Waiting for Pages artifact indexing ($n/18)"
            sleep 5
          done
          echo "Pages artifact could not be discovered through GitHub API" >&2
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
