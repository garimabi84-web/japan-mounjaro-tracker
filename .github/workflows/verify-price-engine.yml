name: Verify strict price engine
on:
  push:
    branches: [main]
    paths:
      - 'price_engine_v2.py'
      - '.github/workflows/verify-price-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 requests
      - name: Validate package, plan and cross-drug evidence extraction
        run: |
          python -m py_compile price_engine_v2.py
          python price_engine_v2.py
      - name: Confirm actual W Clinic and Sakai official page pack units
        run: |
          python - <<'PY'
          import requests
          from price_engine_v2 import parse_official_v2
          cases=[
              ('https://wclinic-osaka.jp/medicine/mounjaro/','2.5',68640),
              ('https://wclinic-osaka.jp/medicine/mounjaro/','5',99000),
              ('https://www.kiyama-naishikyou.jp/diet/','10',198000)]
          cache={}
          for url,dose,expected in cases:
              if url not in cache:
                  rsp=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=(8,20))
                  rsp.raise_for_status()
                  cache[url]=parse_official_v2(rsp.content,url)
              prices,basis,ev=cache[url]
              print('OFFICIAL REGRESSION',url,dose,'expected',expected,'got',prices.get(dose),'proof',ev.get(dose),flush=True)
              assert prices.get(dose)==expected,(url,dose,prices,ev)
          PY
